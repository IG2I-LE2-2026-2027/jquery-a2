<script src="jquery.js"></script>
<style>
.controle {display:none;}
#contenu textarea {
	display:block;
}
#contenu p {
	padding:2px;
	border-left:3px solid black;
}

#contenu.modeEdition p:hover {
	cursor: pointer;
	border : 1px solid black;
}
</style>
<script>

// Composants ///////////////////////////////////
var jComposantTA = $("<textarea>")
										.keydown(function(contexte){
			// Son comportement : lors de l'appui sur ENTREE
			// Cf. événément keydown
			// Il doit redevenir un P						
			// Commment retrouver le contexte de l'événement ?
			console.log(contexte);
			if (contexte.key == "Enter") {
				var contenu = $(this).val(); 
				var jPClone = jComposantP
												.clone(true)
												.html(contenu);
				$(this).replaceWith(jPClone);
			}				
		}); 



var jComposantP = $("<p>")
	.html("Nouveau")
	.click(function(){
		// unité de lieu : au même endroit 
		// on voit : la nature de l'événement: click
		// ET le comportement associé 
		
		// Si pas en mode édition : ne rien faire 
		if (! $("#contenu").hasClass("modeEdition")) return; 
		
		// lors du click sur un P: 
		// 1) récup. contenu du P
		var contenu = $(this).html();
		// Référence jquery vers l'élément cible de l'événement : $(this)
		// 2) créer un composant Textarea avec le même contenu 
		var jTAClone = jComposantTA
										.clone(true)
										.val(contenu);
		// 3) remplacer le P. par le Textarea
		// jP.replaceWith(jTA)
		
		$(this).replaceWith(jTAClone);
		console.log("click sur P");
	}); 

// Composants ///////////////////////////////////



	function toggleMode() {
		// afficher/cacher le #contenu 
		$(".controle").toggle();
		$("#contenu").toggleClass("modeEdition");

		//if ($("input[value='Passer en Mode Edition']").length) 
		if ($("#contenu").hasClass("modeEdition"))
			$("input[value='Passer en Mode Edition']").val("Quitter le Mode Edition");
		else		
			$("input[value='Quitter le Mode Edition']").val("Passer en Mode Edition");
	}
	
function addP(refBtnPlus) {
	// récupérer une référence jQuery vers le bouton + cliqué : 
	// ==> $(refJS)
	var jBtnPlus = $(refBtnPlus)
	var contenu = jBtnPlus
									.prev()	// élément qui précède
									.val(); // contenu d'un champ de form. 
	console.log("Paragraphe à créer : " + contenu);
	
	// console.log($("input[value='+']").index(refBtnPlus));
	// console.log($("input[value='+']").index(jBtnPlus));
	
	var jPClone = jComposantP.clone(true);
	if (contenu != "") jPClone.html(contenu);
	
	if ($("input[value='+']").index(refBtnPlus) == 0) {
		// 0 <=> haut 
		$("#contenu").prepend(jPClone);
	} else {
		// ! 0 <=> bas 
		$("#contenu").append(jPClone);
	}

}
</script>

<body>

	<div class="controle"> Mode Edition </div>

	<input type="button" onclick="toggleMode();" value="Passer en Mode Edition"/>
	
	<input type="text" class="controle" />
	<input type="button" value="+" class="controle" onclick="addP(this);"/>
	
	<div id="contenu">
		<p>p1</p>
		<p>p2</p>
		<p>p3</p>
	</div>
	<input type="button" onclick="toggleMode();" value="Passer en Mode Edition"/>
	
		<input type="text" class="controle"/>
	<input type="button" value="+" class="controle" onclick="addP(this);"/>
</body>

<script src="jquery.js"></script>
<style>
	.allume {background-color:yellow;}
	.exemple {display:none;}
</style>
<script>
	function decollage() {
		// symbole $ <=> fonction jQuery
		
		// $("selecteur CSS++") 
		// Résultat : une collection 
		// de références jQuery 
		
		// beaucoup de méthodes de la collection
		// s'appliquent à TOUS les éléments 
		// de la collection  
		
		// beaucoup de méthodes de la collection 
		// renvoient comme résultat 
		// la collection elle-même !!
		// => permet de cascader les appels de méthode 
		$(".exemple")
			.addClass("allume")
			.show("slow"); 
	}
</script>

<body>
	<input type="button" onclick="decollage()" value="GO"/>
	<p class="exemple"> P1 </p>
	<p class=""> P2 </p>
	<p class="exemple"> P3 </p>
	<div class="exemple"> div1 </div>
	<div class=""> div2 </div>
	<div class="exemple"> div3 </div>
</body>

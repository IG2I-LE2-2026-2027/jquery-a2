<script src="jquery.js"></script>
<style>
</style>
<script>
	function toggleShow() {
		// afficher/cacher le #contenu 
		$("#contenu").toggle();

		// mettre à jour le label du bouton 
		
		// Alternatives : utiliser une variable 
		// if (!$("#contenu").is(":visible")) 
		
		// tester l'existence : récupérer la référence jquery et tester la taille de la collection 
		if ($("input[value='Cacher']").length) 
			$("input[value='Cacher']").val("Afficher");
		else		
			$("input[value='Afficher']").val("Cacher");
	}
</script>

<body>
	<input type="button" onclick="toggleShow();" value="Cacher"/>
	<div id="contenu">
		<p>p1</p>
		<p>p2</p>
		<p>p3</p>
	</div>
	<input type="button" onclick="toggleShow();" value="Cacher"/>
</body>
